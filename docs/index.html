<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TWD-HKD 匯率走勢圖</title>
  <meta name="description" content="TWD 對 HKD 匯率走勢圖，每日自動更新，支援 7/30/90/180 天期間切換。">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1/dist/chartjs-plugin-annotation.min.js"></script>
</head>

<body>
  <div class="container">
    <div class="header">
      <h1>💱 匯率走勢圖</h1>
      <div id="sse-status-indicator" class="connected" title="數據已同步"></div>
      <div class="subtitle">TWD ⇒ HKD 匯率分析（自動更新）</div>
    </div>

    <div class="main-content">
      <!-- 左側內容區 -->
      <div class="left-content">
        <!-- 控制區 -->
        <div class="controls">
          <div class="controls-content">
            <div class="period-buttons">
              <button class="period-btn active" data-period="7">近1週</button>
              <button class="period-btn" data-period="30">近1個月</button>
              <button class="period-btn" data-period="90">近3個月</button>
              <button class="period-btn" data-period="180">近6個月</button>
            </div>
          </div>
        </div>

        <!-- 圖表區 -->
        <div class="content">
          <div id="chart-container" class="chart-container">
            <!-- 載入動畫 -->
            <div id="chartSpinner" class="spinner-container">
              <p>正在載入圖表...</p>
            </div>
            <!-- Chart.js Canvas -->
            <canvas id="rateChart" style="display: none; width: 100%; height: 100%;"></canvas>
          </div>
        </div>
      </div>

      <!-- 右側面板 -->
      <div class="right-panel">
        <!-- 貨幣卡片 -->
        <div class="currency-selector">
          <div class="currency-selector-header">
            <h3>🔄 貨幣兌換</h3>
          </div>
          <div class="currency-inputs">
            <div class="currency-input-group">
              <label>買入貨幣</label>
              <div class="currency-search-wrapper">
                <input type="text" class="currency-input" value="TAIWAN DOLLAR - TWD" readonly tabindex="-1">
              </div>
            </div>
            <div class="exchange-arrow">⇩</div>
            <div class="currency-input-group">
              <label>賣出貨幣</label>
              <div class="currency-search-wrapper">
                <input type="text" class="currency-input" value="HONG KONG DOLLAR - HKD" readonly tabindex="-1">
              </div>
            </div>
          </div>
          <div class="currency-notice">
            <small>💡 靜態展示：固定顯示 TWD ⇒ HKD</small>
          </div>
        </div>

        <!-- 最新匯率區塊 -->
        <div class="latest-rate-container">
          <div class="latest-rate-header">
            <h3>💰 最新匯率 (TWD ⇒ HKD)</h3>
          </div>
          <div id="latest-rate-content" class="latest-rate-content">
            <!-- 動態載入 -->
          </div>
        </div>

        <!-- 統計數據區 -->
        <div id="statsContainer" class="stats-container">
          <div class="stats-header">
            <h3>📊 圖表統計</h3>
          </div>
          <div class="stats-grid">
            <div class="stat-item" id="maxRate">最高匯率: N/A</div>
            <div class="stat-item" id="minRate">最低匯率: N/A</div>
            <div class="stat-item" id="avgRate">平均匯率: N/A</div>
            <div class="stat-item" id="dataPoints">數據點: N/A</div>
            <div id="dateRange" class="stat-item full-width">數據範圍: N/A</div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>

</html>
