name: Update TWD-HKD Exchange Rates

on:
  schedule:
    # UTC 01:00 = 台北 09:00，週一到週五
    - cron: '0 1 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-rates:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests playwright==1.58.0 playwright-stealth
          playwright install chromium --with-deps

      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Fetch exchange rates
        run: xvfb-run python scripts/fetch_rates.py

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/TWD-HKD_180d.json
          git diff --cached --quiet || git commit -m "chore: update TWD-HKD rates $(date -u +%Y-%m-%d)"
          git push
